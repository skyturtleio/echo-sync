<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>echo-sync browser spike</title>
    <style>
      body {
        font:
          14px/1.4 system-ui,
          sans-serif;
        margin: 16px;
        background: #111;
        color: #ddd;
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 4px;
        font-weight: 700;
      }
      .leader {
        background: #1f7a3a;
        color: #fff;
      }
      .follower {
        background: #2a4d7a;
        color: #fff;
      }
      .down {
        background: #7a2a2a;
        color: #fff;
      }
      table {
        border-collapse: collapse;
        margin-top: 8px;
      }
      td {
        padding: 2px 10px 2px 0;
        vertical-align: top;
      }
      td:first-child {
        color: #888;
      }
      pre {
        background: #1b1b1b;
        padding: 8px;
        max-height: 260px;
        overflow: auto;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h3>echo-sync browser substrate spike <span id="badge" class="badge down">starting</span></h3>
    <table>
      <tr>
        <td>tab</td>
        <td id="tab"></td>
      </tr>
      <tr>
        <td>mode</td>
        <td id="mode"></td>
      </tr>
      <tr>
        <td>serving leader</td>
        <td id="leader"></td>
      </tr>
      <tr>
        <td>db</td>
        <td id="db"></td>
      </tr>
      <tr>
        <td>live <code>count(*) FROM items</code></td>
        <td id="live"></td>
      </tr>
    </table>
    <pre id="log"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
