services:
  postgres:
    platforms: [linux]
    port: 5432
    # Local test data only: trade crash durability for speed, never expose a portal.
    command: >-
      exec /usr/lib/postgresql/15/bin/postgres
      -D "$HOME/.local/share/echo-sync/postgres"
      -h 127.0.0.1 -p "$PORT"
      -k "$HOME/.local/share/echo-sync/postgres"
      -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      -c max_connections=300
